services:
  # ----------------------------------------------------------------------------
  # HireLens Express Backend API Service (Render Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: hirelens-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_SYNTHETIC_SCRAPER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: hirelens-postgres
          property: connectionString
      - key: REDIS_HOST
        value: 127.0.0.1
      - key: REDIS_PORT
        value: 6379
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"

databases:
  # ----------------------------------------------------------------------------
  # Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: hirelens-postgres
    plan: free
    databaseName: hirelens
    user: hirelens_user
