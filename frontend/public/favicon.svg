<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark carbon background -->
  <rect width="32" height="32" fill="#0A0A0B" rx="4" />
  
  <!-- Outer radar ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#262626" stroke-width="1.5" />
  <!-- Mid radar ring -->
  <circle cx="16" cy="16" r="7" fill="none" stroke="#383838" stroke-width="1.5" />
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#10B981" />
  
  <!-- Radar Crosshairs -->
  <line x1="16" y1="4" x2="16" y2="28" stroke="#262626" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="4" y1="16" x2="28" y2="16" stroke="#262626" stroke-width="1" stroke-dasharray="2 2" />
  
  <!-- Sweep sector / blip -->
  <circle cx="21" cy="11" r="2" fill="#FC5000" />
</svg>
